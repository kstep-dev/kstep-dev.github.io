<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kSTEP</title>
<style>
  :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #f7f7f5; --mute: #6b6b6b; --line: #d9d9d4; --accent: #2b6cb0; --ok: #2f855a; --bad: #c53030; --con: #111; --confg: #d8d8d8; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6e6e3; --bg: #16161a; --mute: #9a9a9a; --line: #2e2e33; --accent: #63a4ff; --ok: #48bb78; --bad: #f56565; --con: #0b0b0d; --confg: #cfcfcf; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: end; padding: .8rem 1rem; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 1rem; margin: 0 1rem 0 0; align-self: center; }
  label { display: flex; flex-direction: column; font-size: .75rem; color: var(--mute); gap: .15rem; }
  .settings { font-size: .8rem; color: var(--mute); align-self: center; }
  input, select, button { font: inherit; padding: .3rem .5rem; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--fg); }
  input[type=number] { width: 5rem; } input[type=text] { width: 9rem; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--mute); }
  #status.ok { color: var(--ok); } #status.bad { color: var(--bad); }
  main { flex: 1; display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  #panes { display: grid; grid-template-columns: 3fr 2fr; min-height: 0; }
  @media (max-width: 900px) { #panes { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-left: 1px solid var(--line); }
  .pane:first-child { border-left: 0; }
  .pane h2 { margin: 0; padding: .3rem 1rem; font-size: .75rem; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .pane h2 span { display: flex; gap: .4rem; }
  .pane h2 button { font-size: .7rem; padding: .1rem .5rem; text-transform: none; letter-spacing: 0; font-weight: 400; cursor: pointer; }
  .pane h2 button:disabled { cursor: default; }
  footer:empty, footer:has(#warn:empty) { display: none; }
  .pane pre { flex: 1; margin: 0; padding: .75rem 1rem; overflow: auto; background: var(--con); color: var(--confg); font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
  footer { display: flex; gap: 1rem; padding: .5rem 1rem; border-top: 1px solid var(--line); font-size: .8rem; color: var(--mute); align-items: center; }
  footer a { color: var(--accent); } footer a[hidden] { display: none; }
  #warn { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>kSTEP</h1>
  <label>bug <select id="kernel"></select></label>
  <span id="settings" class="settings"></span>
  <button id="run" class="primary">Run</button>
  <span id="status">idle</span>
</header>
<main>
  <div id="panes">
    <div class="pane"><h2>kernel console <span><button data-copy="console">copy</button><button data-save="console">download</button></span></h2><pre id="console"></pre></div>
    <div class="pane"><h2>driver output <span><button data-copy="jsonl">copy</button><button data-save="jsonl">download</button></span></h2><pre id="jsonl"></pre></div>
  </div>
  <footer><span id="warn"></span></footer>
</main>
<!-- GitHub Pages cannot set COOP/COEP headers; this service worker adds them on reload. -->
<script src="coi-serviceworker.min.js"></script>
<script type="module">
const $ = (id) => document.getElementById(id);
const con = $('console'), out = $('jsonl'), status = $('status'), warn = $('warn');

// The one hard requirement: SharedArrayBuffer, which needs COOP/COEP headers. The
// service worker above adds them and reloads once. (No Memory64 needed: the QEMU
// binary is lowered to wasm32 via --enable-wasm64-32bit-address-limit.)
if (typeof SharedArrayBuffer === 'undefined')
  warn.textContent = 'SharedArrayBuffer unavailable; reload once so the service worker can add the COOP/COEP headers.';

// kernels.json (generated by deploy.sh): {version, base, kernels:[{name, driver, num_cpus, mem_mb}]}.
// Images are fetched from `base`, the kstep-dev/build repo on GitHub at the commit kSTEP pins.
// `version` is appended to the wasm/js/bios URLs so a new deploy is never served from cache.
// Reproduce mode: driver, vCPUs and RAM are the values reproduce.py uses for the bug.
let V = '', base = '', kernels = [];
try {
  ({ version: V, base, kernels } = await (await fetch('kernels.json', { cache: 'no-store' })).json());
  $('kernel').replaceChildren(...kernels.map(k => new Option(k.name, k.name)));
  if (!kernels.length) warn.textContent = 'No kernels listed in kernels.json.';
} catch (e) { warn.textContent = 'kernels.json failed: ' + e.message; }
const { BIOS, runKstep } = await import(`./kstep.mjs?v=${V}`);
const selected = () => kernels.find(k => k.name === $('kernel').value);
const showSettings = () => { const k = selected(); $('settings').textContent = k ? `driver ${k.driver} · ${k.num_cpus} vCPUs · ${k.mem_mb} MB` : ''; };
$('kernel').onchange = showSettings;
// Restore the last run's bug from the URL (written on Run) so a reload keeps it and the URL is shareable.
const q = new URLSearchParams(location.search);
if (kernels.some(k => k.name === q.get('kernel'))) $('kernel').value = q.get('kernel');
showSettings();

// Copy / download act on the pane's current text.
const files = { console: 'qemu.log', jsonl: 'kstep.jsonl' };
document.querySelectorAll('.pane button').forEach(b => {
  const id = b.dataset.copy || b.dataset.save;
  b.disabled = true;
  b.onclick = () => {
    const text = $(id).textContent;
    if (b.dataset.copy) {
      navigator.clipboard.writeText(text).then(() => { b.textContent = 'copied'; setTimeout(() => b.textContent = 'copy', 1200); });
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' })); a.download = files[id]; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }
  };
});
const enableActions = (on) => document.querySelectorAll('.pane button').forEach(b => b.disabled = !on);

$('run').onclick = async () => {
  const k = selected(); if (!k) return;
  $('run').disabled = true; enableActions(false);
  con.textContent = ''; out.textContent = '';
  history.replaceState(null, '', '?' + new URLSearchParams({ kernel: k.name }));
  const t0 = performance.now();
  const setStatus = (s, cls = '') => { status.textContent = `${((performance.now() - t0) / 1000).toFixed(1)}s  ${s}`; status.className = cls; };
  // Lines are appended to the panes in 50 ms batches; each pane follows its tail unless scrolled up.
  const panes = { console: { el: con, pending: '' }, jsonl: { el: out, pending: '' } };
  let timer = 0;
  const flush = () => {
    timer = 0;
    for (const p of Object.values(panes)) {
      if (!p.pending) continue;
      const atBottom = p.el.scrollHeight - p.el.scrollTop - p.el.clientHeight < 40;
      p.el.append(p.pending); p.pending = '';
      if (atBottom) p.el.scrollTop = p.el.scrollHeight;
    }
  };
  try {
    setStatus('fetching images');
    const get = (u) => fetch(u).then(r => { if (!r.ok) throw new Error(`${u}: HTTP ${r.status}`); return r.arrayBuffer(); });
    const [kernel, rootfs, { default: Module }, ...bios] = await Promise.all([
      get(`${base}/${k.name}/kernel`), get(`${base}/${k.name}/rootfs.cpio`),
      import(`./qemu/qemu-system-x86_64.js?v=${V}`), ...BIOS.map(f => get(`qemu/${f}?v=${V}`)),
    ]);
    setStatus('starting qemu');
    const { done } = await runKstep(Module, {
      files: { kernel, rootfs, bios: Object.fromEntries(BIOS.map((f, i) => [f, bios[i]])) },
      driver: k.driver, smp: k.num_cpus, mem: k.mem_mb,
      locateFile: (f) => `qemu/${f}?v=${V}`,
      onLine: (ch, line) => { panes[ch].pending += line + '\n'; if (!timer) timer = setTimeout(flush, 50); if (ch === 'console') setStatus('running'); },
    });
    const { panic } = await done;
    flush(); enableActions(true);
    setStatus(panic ? 'kernel panic' : 'done', panic ? 'bad' : 'ok');
  } catch (e) {
    setStatus('error: ' + e.message, 'bad'); console.error(e);
  }
  // The QEMU instance does not exit cleanly under Emscripten, so a new run reloads the
  // page; the selected bug survives via the URL.
  $('run').textContent = 'Run again';
  $('run').disabled = false; $('run').onclick = () => location.reload();
};
</script>
</body>
</html>
