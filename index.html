<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kSTEP on wasm</title>
<style>
  :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #f7f7f5; --mute: #6b6b6b; --line: #d9d9d4; --accent: #2b6cb0; --ok: #2f855a; --bad: #c53030; --con: #111; --confg: #d8d8d8; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6e6e3; --bg: #16161a; --mute: #9a9a9a; --line: #2e2e33; --accent: #63a4ff; --ok: #48bb78; --bad: #f56565; --con: #0b0b0d; --confg: #cfcfcf; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: end; padding: .8rem 1rem; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 1rem; margin: 0 1rem 0 0; align-self: center; }
  label { display: flex; flex-direction: column; font-size: .75rem; color: var(--mute); gap: .15rem; }
  input, select, button { font: inherit; padding: .3rem .5rem; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--fg); }
  input[type=number] { width: 5rem; } input[type=text] { width: 9rem; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--mute); }
  #status.ok { color: var(--ok); } #status.bad { color: var(--bad); }
  main { flex: 1; display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  #panes { display: grid; grid-template-columns: 3fr 2fr; min-height: 0; }
  @media (max-width: 900px) { #panes { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-left: 1px solid var(--line); }
  .pane:first-child { border-left: 0; }
  .pane h2 { margin: 0; padding: .3rem 1rem; font-size: .75rem; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  .pane h2 span { font-weight: 400; text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .pane pre { flex: 1; margin: 0; padding: .75rem 1rem; overflow: auto; background: var(--con); color: var(--confg); font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
  footer { display: flex; gap: 1rem; padding: .5rem 1rem; border-top: 1px solid var(--line); font-size: .8rem; color: var(--mute); align-items: center; }
  footer a { color: var(--accent); } footer a[hidden] { display: none; }
  #warn { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>kSTEP on wasm</h1>
  <label>kernel <select id="kernel"></select></label>
  <label>driver <input id="driver" type="text" value=""></label>
  <label>vCPUs <input id="smp" type="number" min="1" max="32" value="2"></label>
  <label>RAM (MB) <input id="mem" type="number" min="128" max="1024" step="128" value="512"></label>
  <button id="run" class="primary">Run</button>
  <span id="status">idle</span>
</header>
<main>
  <div id="panes">
    <div class="pane"><h2>kernel console (qemu.log) <span id="n-console"></span></h2><pre id="console"></pre></div>
    <div class="pane"><h2>driver output (kstep.jsonl) <span id="n-jsonl"></span></h2><pre id="jsonl"></pre></div>
  </div>
  <footer>
    <span id="warn"></span>
    <span id="dl">results:</span>
    <a id="dl-jsonl" hidden download="kstep.jsonl">kstep.jsonl</a>
    <a id="dl-log" hidden download="qemu.log">qemu.log</a>
    <a id="dl-cov" hidden download="kstep.cov">kstep.cov</a>
  </footer>
</main>
<!-- GitHub Pages cannot set COOP/COEP headers; this service worker adds them on reload. -->
<script src="coi-serviceworker.min.js"></script>
<script type="module">
const V = '__VERSION__';   // replaced by deploy.sh; busts caches of the wasm/js across deploys
const $ = (id) => document.getElementById(id);
const con = $('console'), out = $('jsonl'), status = $('status'), warn = $('warn');

// Preconditions: SharedArrayBuffer (COOP/COEP headers) and Memory64.
if (typeof SharedArrayBuffer === 'undefined')
  warn.textContent = 'SharedArrayBuffer unavailable: the page needs COOP/COEP headers (serve.py sets them; on static hosting the service worker adds them after one reload).';
// The QEMU binary is lowered to wasm32 (QEMU's --enable-wasm64-32bit-address-limit), so no
// Memory64 check is needed; SharedArrayBuffer (above) is the only hard requirement.

// kernels.json: {base, kernels:[{name, driver, num_cpus, mem_mb}]}. `base` is where the
// images live: the kstep-dev/build repo on GitHub for the published site, ./images locally.
let base = 'images', kernels = [];
try {
  ({ base, kernels } = await (await fetch(`kernels.json?v=${V}`)).json());
  $('kernel').replaceChildren(...kernels.map(k => new Option(k.name, k.name)));
  if (!kernels.length) warn.textContent = 'No kernels listed. Build one with `make KERNEL=<name>` in the kstep root.';
} catch (e) { warn.textContent = 'kernels.json failed: ' + e.message; }
const fill = () => {
  const k = kernels.find(k => k.name === $('kernel').value); if (!k) return;
  $('driver').value = k.driver; $('smp').value = k.num_cpus; $('mem').value = Math.min(k.mem_mb, 1024);
  warn.textContent = k.mem_mb > 1024 ? `reproduce.py uses ${k.mem_mb} MB for this bug; the wasm heap allows at most 1024 MB.` : '';
};
$('kernel').onchange = fill; fill();

let running = false;
$('run').onclick = async () => {
  if (running) return;
  running = true; $('run').disabled = true;
  for (const id of ['dl-jsonl', 'dl-log', 'dl-cov']) $(id).hidden = true;
  con.textContent = ''; out.textContent = ''; $('n-console').textContent = ''; $('n-jsonl').textContent = '';
  const kernel = $('kernel').value, driver = $('driver').value.trim() || kernel.replace(/_(buggy|fixed)$/, '');
  const smp = Math.max(1, +$('smp').value || 2), mem = Math.max(128, +$('mem').value || 512);
  const t0 = performance.now();
  const setStatus = (s, cls = '') => { status.textContent = `${((performance.now() - t0) / 1000).toFixed(1)}s  ${s}`; status.className = cls; };

  try {
    setStatus('fetching images');
    const get = (u) => fetch(u).then(r => { if (!r.ok) throw new Error(`${u}: HTTP ${r.status}`); return r.arrayBuffer(); });
    const bios = ['bios-256k.bin', 'linuxboot_dma.bin', 'kvmvapic.bin'];
    const [kimg, rootfs, { default: Module }, ...biosImgs] = await Promise.all([
      get(`${base}/${kernel}/kernel`), get(`${base}/${kernel}/rootfs.cpio`),
      import(`./qemu/qemu-system-x86_64.js?v=${V}`), ...bios.map(f => get(`qemu/${f}?v=${V}`)),
    ]);
    const isol = smp > 2 ? `1-${smp - 1}` : '1';
    const boot = `rw nokaslr loglevel=7 sched_verbose isolcpus=nohz,managed_irq,${isol} irqaffinity=0 rcu_nocbs=${isol} nohz_full=${isol} init=/user panic=-1 console=ttyS0 tsc=nowatchdog -- driver=${driver}`;
    // One byte collector per channel. The console and jsonl channels are also split
    // into lines and streamed into their panes as they complete.
    const chan = { 'kstep.jsonl': [], 'qemu.log': [], 'kstep.cov': [] };
    const panes = {
      'qemu.log':    { el: con, count: $('n-console'), line: '', lines: 0, pending: '', timer: 0 },
      'kstep.jsonl': { el: out, count: $('n-jsonl'),   line: '', lines: 0, pending: '', timer: 0 },
    };
    let resolveDone;
    const done = new Promise(r => { resolveDone = r; });
    const flush = (p) => {
      p.timer = 0;
      if (!p.pending) return;
      const atBottom = p.el.scrollHeight - p.el.scrollTop - p.el.clientHeight < 40;
      p.el.append(p.pending); p.pending = '';
      if (atBottom) p.el.scrollTop = p.el.scrollHeight;
      p.count.textContent = `${p.lines} lines`;
    };
    const finish = (panic) => {
      Object.values(panes).forEach(flush);
      for (const [f, id] of [['kstep.jsonl', 'dl-jsonl'], ['qemu.log', 'dl-log'], ['kstep.cov', 'dl-cov']]) {
        const a = $(id); a.href = URL.createObjectURL(new Blob([new Uint8Array(chan[f])])); a.hidden = false;
      }
      setStatus(panic ? 'kernel panic' : 'done', panic ? 'bad' : 'ok');
      resolveDone();
    };
    const onLine = (name, l) => {
      const p = panes[name];
      p.lines++; p.pending += l + '\n';
      if (!p.timer) p.timer = setTimeout(() => { flush(p); if (name === 'qemu.log') setStatus(`running, ${p.lines} lines`); }, 50);
      if (name === 'qemu.log' && (l.includes('Kernel panic') || l.includes('reboot: Restarting system')))
        finish(l.includes('Kernel panic'));
    };
    const sink = (name) => (byte) => {
      chan[name].push(byte);
      const p = panes[name];
      if (!p) return;
      if (byte === 10) { onLine(name, p.line); p.line = ''; } else p.line += String.fromCharCode(byte);
    };
    setStatus('starting qemu');
    const mod = await Module({
      locateFile: (f) => `qemu/${f}?v=${V}`,
      arguments: [
        '-smp', String(smp), '-cpu', 'max', '-m', `${mem}M`, '-L', '/bios',
        '-accel', 'tcg,tb-size=500,thread=multi',
        '-kernel', '/kernel', '-initrd', '/rootfs.cpio', '-append', boot,
        '-nographic', '-nodefaults', '-no-reboot',
        '-chardev', 'file,id=c0,path=/dev/kstep0', '-serial', 'chardev:c0',
        '-chardev', 'file,id=c1,path=/dev/kstep1', '-serial', 'chardev:c1',
        '-chardev', 'file,id=c2,path=/dev/kstep2', '-serial', 'chardev:c2',
      ],
      preRun: [(m) => {
        m.FS.mkdir('/bios');
        bios.forEach((f, i) => m.FS.writeFile(`/bios/${f}`, new Uint8Array(biosImgs[i])));
        m.FS.writeFile('/kernel', new Uint8Array(kimg));
        m.FS.writeFile('/rootfs.cpio', new Uint8Array(rootfs));
        Object.keys(chan).forEach((name, i) => m.FS.createDevice('/dev', `kstep${i}`, null, sink(name)));
      }],
      print: (s) => console.log('[qemu]', s),
      printErr: (s) => { if (!s.includes('unsupported syscall')) console.warn('[qemu]', s); },
    });

    // The chardevs write to /dev/kstep0..2, Emscripten device nodes whose write callbacks
    // (registered in preRun above) push each byte here; nothing is polled.
    await done;
  } catch (e) {
    setStatus('error: ' + e.message, 'bad'); console.error(e);
  }
  // The QEMU instance does not exit cleanly under Emscripten; reload to run again.
  $('run').textContent = 'Reload to run again';
  $('run').disabled = false; $('run').onclick = () => location.reload();
};
</script>
</body>
</html>
